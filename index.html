<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Dasar JavaScript - Mode Terang & Gelap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header & Tombol Toggle Theme -->
        <header class="header">
            <h1>Latihan JavaScript</h1>
            <button id="themeToggle" onclick="toggleTheme()" class="theme-btn">
                🌙 Mode Gelap
            </button>
        </header>

        <!-- Bagian 1: Manipulasi DOM & Alert -->
        <section class="card">
            <h2>1. Ubah hello world</h2>
            <h3 id="halo">Hello World</h3>
            
            <div class="button-group">
                <!-- Inline JavaScript -->
                <button onclick="document.getElementById('halo').innerHTML = 'Hello JS!'">Inline JS (Ubah Teks)</button>
                <button onclick="alert('Hello JS!')">Inline JS (Alert)</button>

                <!-- Function JavaScript -->
                <button onclick="changeText()">Function JS (Ubah Teks)</button>
            </div>
        </section>

        <!-- Bagian 2: Tangkap Input Form -->
        <section class="card">
            <h2>2. Input Data</h2>
            <form id="myForm" onsubmit="return kirimData(event)">
                <div class="form-group">
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" placeholder="Masukkan nama..." required>
                </div>

                <div class="form-group">
                    <label for="umur">Umur:</label>
                    <input type="number" id="umur" placeholder="Masukkan umur..." required>
                </div>

                <button type="submit" class="submit-btn">Kirim Data</button>
            </form>

            <p id="hasil" class="result-text"></p>
        </section>

        <!-- Bagian 3: Konfirmasi Link -->
        <section class="card">
            <h2>3. Konfirmasi Link</h2>
            <p class="desc-text">
                Klik tombol di bawah untuk menguji konfirmasi sebelum membuka halaman baru:
            </p>
            <a href="https://www.w3schools.com" 
   target="_blank" 
   onclick="return confirm('Apakah Anda yakin ingin membuka W3Schools untuk belajar?')" 
   class="link-button">
   Buka W3Schools ↗
</a>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
